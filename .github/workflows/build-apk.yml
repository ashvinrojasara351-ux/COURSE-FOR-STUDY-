name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          java -version
          echo "JAVA_HOME is: ${JAVA_HOME}"
          
          if [ -z "${JAVA_HOME}" ] || [ ! -d "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not set or directory does not exist."
            exit 1
          fi

          JAVA_RAW_VERSION=$(java -version 2>&1 | head -n 1)
          echo "Raw Java Version Output: ${JAVA_RAW_VERSION}"

          # Extract major version number (e.g., from "17.0.2" or "17")
          JAVA_MAJOR=$(echo "${JAVA_RAW_VERSION}" | sed -E 's/.*version "([0-9]+).*/\1/')

          if [ -z "${JAVA_MAJOR}" ] || ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Unable to detect Java major version from output: ${JAVA_RAW_VERSION}"
            exit 1
          fi

          echo "Detected Java Major Version: ${JAVA_MAJOR}"

          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "ERROR: Active Java version (${JAVA_MAJOR}) is lower than the required Java 17."
            exit 1
          fi

          echo "Java environment verified successfully: Java ${JAVA_MAJOR} (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking / Generating Temporary Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root. Skipping generation."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            "${JAVA_HOME}/bin/keytool" -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to create ./debug.keystore."
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build debug APK
        run: |
          echo "=== Building Debug APK with Gradle 9.3.1 ==="
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          echo "=== Verifying Built APK ==="
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${TARGET_APK}" ]; then
            echo "ERROR: Expected debug APK not found at: ${TARGET_APK}"
            echo "Searching only inside app/build/outputs/apk for any generated APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "${TARGET_APK}" ]; then
            echo "ERROR: APK file exists at ${TARGET_APK} but is empty (0 bytes)."
            exit 1
          fi

          case "${TARGET_APK}" in
            *.apk) ;;
            *)
              echo "ERROR: File ${TARGET_APK} does not have a .apk extension."
              exit 1
              ;;
          esac

          if [ "${TARGET_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Selected APK path does not match app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "${TARGET_APK}" 2>/dev/null || stat -f%z "${TARGET_APK}" 2>/dev/null)
          echo "APK verified successfully: ${TARGET_APK} (${APK_SIZE} bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          TEMP_ASSET_DIR="${RUNNER_TEMP}/apk_release_asset"
          mkdir -p "${TEMP_ASSET_DIR}"

          # Sanitize repository name (keep only a-z, 0-9, _, -)
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          CLEAN_REPO_NAME=$(echo "${RAW_REPO_NAME}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_-' '-' | sed 's/^-*//;s/-*$//')
          if [ -z "${CLEAN_REPO_NAME}" ]; then
            CLEAN_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${CLEAN_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          DEST_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"

          cp -v app/build/outputs/apk/debug/app-debug.apk "${DEST_PATH}"

          if [ ! -s "${DEST_PATH}" ]; then
            echo "ERROR: Prepared release asset ${DEST_PATH} does not exist or is empty."
            exit 1
          fi

          echo "Prepared release asset: ${DEST_PATH}"
          echo "asset_path=${DEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "ERROR: Release asset file is missing or empty at: ${ASSET_PATH}"
            exit 1
          fi

          case "${ASSET_PATH}" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset does not have a .apk extension: ${ASSET_PATH}"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number**: #${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt**: #${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA**: \`${GITHUB_SHA}\`
          - **Asset Filename**: \`${ASSET_NAME}\`

          > **Notice:** This APK is intended for testing and development verification. It is not a Play Store production release and is signed with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: ${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --target "${GITHUB_SHA}" \
            --notes "${RELEASE_NOTES}" \
            --latest

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Download & Release Summary ==="
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            echo "GitHub Release published successfully!"
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")

            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Succeeded!

          Your debug APK has been built and published directly to GitHub Releases.

          - **Download Release APK**: [View Release & Download APK](${RELEASE_URL})
          - **Release Tag**: \`${RELEASE_TAG}\`
          - **Release Asset**: \`${ASSET_NAME}\` (available under the **Assets** section of the release)
          - **Workflow Artifact Backup**: The standard GitHub Actions artifact named \`app-debug-apk\` is also available on this workflow run page.
          EOF
          else
            echo "WARNING: GitHub Release publication did not succeed (outcome: ${RELEASE_OUTCOME})."
            echo "The APK build succeeded and the artifact 'app-debug-apk' was uploaded successfully."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Build Succeeded (Release Publishing Warning)

          The debug APK was built successfully and is preserved as a GitHub Actions artifact.

          - **Artifact Name**: \`app-debug-apk\`
          - **How to Download**: Scroll to the bottom of this workflow summary page and download the \`app-debug-apk\` artifact zip.
          - **Release Publishing Status**: GitHub Release publishing encountered an issue or was skipped, but the compiled APK is fully preserved above.
          EOF
          fi
